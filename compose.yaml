services:
  postgres:
    image: postgres:17-alpine
    container_name: baozi-store-postgres
    environment:
      POSTGRES_DB: baozi_store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - baozi_store_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d baozi_store"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  baozi_store_postgres_data:
